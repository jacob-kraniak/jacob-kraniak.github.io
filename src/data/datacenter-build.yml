phasesHeading: phases
phases:
  - name: Network build
    state: done
    window: June 2026
    summary: >-
      Omada SDN is in place. ER605 V2 gateway, SG2008P switch, EAP225 coverage.
      Five VLAN roles: management, trusted, IoT, guest, and lab. 802.1Q tagging is at the gateway.
  - name: Self-hosted services
    state: in progress
    window: July 2026 – ongoing
    summary: >-
      A Lenovo ThinkCentre M715q Tiny runs Proxmox. Wazuh is on CT 100. Portainer,
      and the other containers, are on CT 101. On-prem NetBox is the IPAM source of truth.
      The cloud copy is an archive. Reconcile is still open.
  - name: Open-source routing and remote access
    state: future
    window: not started
    summary: >-
      Off-LAN access to the rack, then a later router. WireGuard or Tailscale is not chosen.
      OPNsense stays in this phase.
