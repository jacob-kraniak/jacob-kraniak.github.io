# Projects page intro. The cards themselves are src/data/projects.json.
#
# Each project object:
#   id        short id. home.yml `featured` lists which ones show on the home page
#   repo      GitHub repo name under your user, or null if there is no public repo yet
#   title, tag, status, summary
#   notes     bullets on this page
#   next      the "next:" line
#   stack     chips
#   placeholder   true keeps the summary amber

documentTitle: "projects · Jacob Kraniak"
prompt: "$ ls ~/projects"
heading: Lab notes
lede: Public repos. Notes are summaries of each README — repos are the source of truth.
diagramsNote: "[PLACEHOLDER — diagrams / screenshots per project]"
